# Builds the Quantverse FerrisKey images and publishes them to
# ghcr.io/<owner>/ferriskey-<target>.
#
# This file is fork-owned on purpose: the upstream docker.yaml pushes to
# ghcr.io/ferriskey/*, which the fork cannot write to. Keeping our pipeline in
# a separate file means upstream syncs never conflict with it.
#
# Tags:
#   push to main      -> :main, :sha-<short>
#   tag v1.2.3[-x]    -> :1.2.3[-x], :sha-<short>, :latest
#   pull request      -> build only, nothing is pushed
#   manual dispatch   -> :<branch>, :sha-<short> when "push" is checked
name: quantverse-images

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/quantverse-images.yaml
      - api/**
      - client/**
      - core/**
      - docker/**
      - front/**
      - libs/**
      - operator/**
      - .dockerignore
      - Cargo.*
      - Dockerfile
      - '!api/tests/**'
      - '!**.md'
  workflow_dispatch:
    inputs:
      push:
        type: boolean
        default: false
        description: Push the images to GHCR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ferriskey
  # Registry-backed layer cache. It has no size cap (unlike the 10 GB GHA
  # cache) and PR builds read the cache that main builds write.
  CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/ferriskey-buildcache
  PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.runner.arch }})
    runs-on: ${{ matrix.runner.name }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - name: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
        target:
          - api
          - webapp
          - standalone
          - operator
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: get image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}

      - name: log in to ghcr
        if: env.PUSH == 'true' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.runner.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional build-time Cap endpoint (repository variable). When empty
          # the front reads it at runtime from /config.json (CAP_API_ENDPOINT).
          build-args: |
            VITE_CAP_API_ENDPOINT=${{ vars.VITE_CAP_API_ENDPOINT }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.target }}-${{ matrix.runner.arch }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:{1}-{2},mode=max', env.CACHE_IMAGE, matrix.target, matrix.runner.arch) || '' }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}

      - name: export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target }}-${{ matrix.runner.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish (${{ matrix.target }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - api
          - webapp
          - standalone
          - operator
    steps:
      - name: download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: get image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$META_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: inspect image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
