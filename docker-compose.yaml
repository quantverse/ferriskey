services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18.2}
    environment:
      PGUSER: ferriskey
      POSTGRES_DB: ferriskey
      POSTGRES_PASSWORD: ferriskey
      POSTGRES_USER: ferriskey
    ports:
      - 5432:5432
    volumes:
      # Postgres 18+ images are designed to mount /var/lib/postgresql (major-version subdirs inside).
      - type: volume
        source: pgdata
        target: /var/lib/postgresql
        volume: {}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
        - -d
        - ferriskey
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  api-build:
    build:
      context: .
      target: api
    environment:
      ALLOWED_ORIGINS: http://localhost:5555,http://127.0.0.1:5555
      DATABASE_HOST: db
      DATABASE_NAME: ferriskey
      DATABASE_PASSWORD: ferriskey
      DATABASE_USER: ferriskey
    ports:
      - 3333:3333
    depends_on:
      db-migrations-build:
        condition: service_completed_successfully
    profiles:
      - build

  db-migrations-build:
    build:
      context: .
      target: api
    entrypoint:
      - sqlx
    command:
      - migrate
      - run
      - --source
      - /usr/local/src/ferriskey/migrations
    environment:
      DATABASE_URL: postgresql://ferriskey:ferriskey@db/ferriskey
    restart: no
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - build

  webapp-build:
    build:
      context: .
      target: webapp
    environment:
      API_URL: http://localhost:3333
    ports:
      - 5555:8080
    profiles:
      - build

  api-registry:
    image: ghcr.io/ferriskey/ferriskey-api
    environment:
      ALLOWED_ORIGINS: http://localhost:5555
      WEBAPP_URL: http://localhost:5555
      DATABASE_HOST: db
      DATABASE_NAME: ferriskey
      DATABASE_PASSWORD: ferriskey
      DATABASE_USER: ferriskey
    ports:
      - 3333:3333
    depends_on:
      db-migrations-registry:
        condition: service_completed_successfully
    profiles:
      - registry

  db-migrations-registry:
    image: ghcr.io/ferriskey/ferriskey-api
    entrypoint:
      - sqlx
    command:
      - migrate
      - run
      - --source
      - /usr/local/src/ferriskey/migrations
    environment:
      DATABASE_URL: postgresql://ferriskey:ferriskey@db/ferriskey
    restart: no
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - registry

  webapp-registry:
    image: ghcr.io/ferriskey/ferriskey-webapp
    environment:
      API_URL: http://localhost:3333
    ports:
      - 5555:80
    profiles:
      - registry

  standalone-build:
    build:
      context: .
      target: standalone
      args:
        # Optional build-time override of CAP_API_ENDPOINT (below), baked
        # into the frontend bundle. Format: http://localhost:3000/<site-key>/
        VITE_CAP_API_ENDPOINT: ${VITE_CAP_API_ENDPOINT:-}
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: ferriskey
      DATABASE_PASSWORD: ferriskey
      DATABASE_USER: ferriskey
      SERVER_ROOT_PATH: /api
      ALLOWED_ORIGINS: http://localhost:8090
      WEBAPP_URL: http://localhost:8090
      # Cap captcha (backend enforcement). Disabled unless CAP_ENABLED=true.
      # CAP_SITE_KEY / CAP_SECRET come from the Cap dashboard. The API reaches
      # the Cap service over the compose network at http://cap:3000.
      CAP_ENABLED: ${CAP_ENABLED:-false}
      CAP_VERIFY_URL: ${CAP_VERIFY_URL:-http://cap:3000}
      CAP_SITE_KEY: ${CAP_SITE_KEY:-}
      CAP_SECRET: ${CAP_SECRET:-}
      CAP_FAIL_OPEN: ${CAP_FAIL_OPEN:-false}
      # Browser-reachable Cap widget endpoint, written into /config.json at
      # start-up. Needed here because CAP_VERIFY_URL is in-network only.
      # Format: http://localhost:3000/<site-key>/
      CAP_API_ENDPOINT: ${CAP_API_ENDPOINT:-}
    ports:
      - 8090:80
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - standalone

  standalone-registry:
    image: ghcr.io/ferriskey/ferriskey-standalone
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: ferriskey
      DATABASE_PASSWORD: ferriskey
      DATABASE_USER: ferriskey
      SERVER_ROOT_PATH: /api
      ALLOWED_ORIGINS: http://localhost:8090
      WEBAPP_URL: http://localhost:8090
    ports:
      - 8090:80
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - standalone-registry

  keydb:
    image: eqalpha/keydb:latest
    command: keydb-server --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - keydbdata:/data
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 5s

  # NOTE: verify the Cap Standalone image tag against the current Cap release
  # (https://github.com/tiagorangel1/cap) before deploying to production.
  # The site key + secret are created in the Cap dashboard (http://localhost:3000,
  # log in with ADMIN_KEY) and supplied to the API via CAP_SITE_KEY / CAP_SECRET.
  cap:
    image: tiago2/cap:latest
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:-change-me-32-chars-minimum-please}
      REDIS_URL: redis://keydb:6379
    ports:
      - 3000:3000
    depends_on:
      keydb:
        condition: service_healthy

volumes:
  pgdata:
    name: ferriskey_pgdata
  keydbdata:
    name: ferriskey_keydbdata
