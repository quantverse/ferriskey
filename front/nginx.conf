server {
  listen 80;

  gzip on;
  gzip_disable "msie6";

  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    application/javascript
    text/css
    text/plain
    text/xml;

  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload';
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options nosniff;

  # SECURITY: This nginx serves the SPA only and does NOT proxy the FerrisKey API.
  # The API's per-IP rate limiting trusts X-Forwarded-For. Whatever reverse proxy
  # sits in front of the API (Helm ingress / API gateway) MUST overwrite it with the
  # real client address — `proxy_set_header X-Forwarded-For $remote_addr;` (NOT
  # `$proxy_add_x_forwarded_for`, which appends client-supplied values and is spoofable).

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
